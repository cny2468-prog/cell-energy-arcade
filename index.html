<!doctype html><html lang="ko" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1724"><meta name="description" content="패들로 아이템을 받고 세포호흡·광합성·효소 미션을 돌파하는 세로형 아케이드 게임"><title>세포 대사 브레이커 | 효소·세포호흡·광합성</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1724'/%3E%3Ctext x='32' y='48' text-anchor='middle' font-size='50' fill='%23c8ff70'%3E✳%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><main class="game-app"><header class="app-header"><span class="app-brand"><i>✳</i> 세포 대사 브레이커</span><div><button id="pause" class="icon-button" aria-label="일시정지">Ⅱ</button><button id="menu-open" class="icon-button" aria-label="게임 메뉴">☰</button></div></header>
<section class="cabinet" aria-label="세포 대사 브레이커"><div class="scoreboard"><div><small>SCORE</small><b id="score">00000</b></div><div class="hearts"><small>LIFE</small><b id="lives">♥♥♥♥♥</b></div><div><small>BEST</small><b id="best">00000</b></div></div>
<div class="level-row"><div><span id="stage-label">LEVEL 01</span><b id="stage-title">1단계 · 효소</b></div><div class="level-dots" aria-label="단계 진행"><div class="stage" data-stage="0"><small></small><span class="stage-check"></span></div><div class="stage" data-stage="1"><small></small><span class="stage-check"></span></div><div class="stage" data-stage="2"><small></small><span class="stage-check"></span></div></div></div>
<div class="battle-hud"><span><i class="time-icon">◷</i> <b id="timer" role="timer" aria-label="단계 남은 시간">03:00</b></span><span>● <b id="ball-count">1</b><small>/4</small></span><span>속도 <b id="speed-value">1.00×</b></span><span>문제 <b id="mission-count">0 / 3</b></span></div><div class="timer-track"><i id="timer-meter"></i></div>
<div class="playfield"><canvas id="game" width="480" height="760" tabindex="0" aria-label="벽돌깨기 게임판. 화면이나 아래 터치패드를 좌우로 드래그해 패들을 움직이세요. 아이템은 패들로만 획득합니다."></canvas><div id="drop-layer" aria-label="패들로 받는 아이템"></div><div id="overlay" class="overlay"></div><section id="game-menu" class="game-menu" hidden><div class="menu-top"><h2>게임 메뉴</h2><button id="menu-close" class="icon-button" aria-label="메뉴 닫기">×</button></div><div class="segmented"><button id="relaxed" class="selected" aria-pressed="true">일반 모드</button><button id="challenge" aria-pressed="false">하드 모드</button></div><p id="mode-note">목숨 5개 · 180 / 165 / 150초</p><p class="player-info">플레이어 <b id="player-label">학번·이름 입력 전</b></p><label>화면 밝기</label><div class="segmented theme-choice"><button data-theme="light" aria-pressed="true">☀ 밝게</button><button data-theme="dark" aria-pressed="false">☾ 어둡게</button></div><div class="menu-grid"><button id="guide">게임 방법</button><button id="item-guide">아이템 도감</button><button id="notebook">개념 노트 <span id="note-count">0</span></button><button id="sound" aria-pressed="false">소리 꺼짐</button><button id="restart" aria-label="1단계부터 새 게임">새 게임</button><button id="sources">제작 정보</button></div><p class="menu-note">아이템은 패들에 닿아야 적용됩니다.<br>초록은 받고, 붉은 아이템은 피하세요.</p></section><div id="toast" class="toast" role="status" aria-live="polite"></div></div>
<div class="effect-bar"><span id="shield-status">◈ 보호막 OFF</span><span id="effect-status">붉은 아이템 주의!</span></div><div class="progress-line"><span id="progress-text">벽돌을 깨고 에너지를 충전하세요</span><span id="brick-count">0 / 18</span></div><div class="progress-track"><i id="progress-bar"></i></div>
<div class="touch-controls"><div id="touch-pad" role="slider" tabindex="0" aria-label="패들 위치" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span>‹</span><div><i></i><small>여기를 좌우로 드래그</small></div><span>›</span></div><button id="launch">공 발사 ↑</button></div></section></main><dialog id="dialog"><div id="dialog-body"></div><button class="dialog-close" id="close-dialog">게임으로 돌아가기</button></dialog><script src="questions.js"></script><script src="docx.js"></script><script src="arcade.js"></script></body></html>
